<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Yasis Breath Timer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yasis Breath">
<meta name="theme-color" content="#1C1710">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --earth:#1C1710;--earth-2:#262017;--clay:#B0896A;
    --sage:#8FA77E;--terracotta:#C4785A;--sand:#E5D9C8;
    --dim:#5A5040;--faint:#3D3529;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;background:#0F0D09}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;width:100%;
    background:radial-gradient(ellipse 130% 90% at 50% 10%,#2E261C 0%,var(--earth) 60%,#0F0D09 100%);
    color:var(--sand);font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.2vh,20px);padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  @media(max-height:720px){
    body{gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    .title{font-size:16px}
    .eyebrow{font-size:10px}
    .stage{max-width:430px}
    .readout{min-height:84px;gap:6px}
    .phrase{font-size:clamp(17px,4.6vw,25px)}
    .controls{gap:10px}
    .play{padding:12px 38px}
    .note{font-size:11px;line-height:1.4;max-width:280px}
  }
  .title{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(18px,4.5vw,24px);letter-spacing:.04em;color:var(--clay)}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--clay);opacity:.7}
  .stage{width:100%;max-width:620px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .track{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round}
  .trace{fill:none;stroke:url(#breathGrad);stroke-width:3;stroke-linecap:round}
  .readout{text-align:center;max-width:520px;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 8px}
  .phrase{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(20px,5.2vw,30px);line-height:1.45;letter-spacing:-.005em}
  .phrase .w{color:var(--dim);transition:color .18s ease}
  .phrase .w.li{color:var(--sage)}
  .phrase .w.lo{color:var(--terracotta)}
  .phase{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);opacity:.65;font-variant-numeric:tabular-nums}
  .controls{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:350px}
  .play{font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--earth);background:var(--sand);border:none;border-radius:999px;padding:15px 46px;cursor:pointer;transition:transform .15s ease,background .2s ease}
  .play:hover{background:#F0E8DA}.play:active{transform:scale(.97)}.play:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
  .row{display:flex;align-items:center;gap:12px;width:100%}
  .row label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);white-space:nowrap;opacity:.7}
  select{flex:1;appearance:none;background:var(--earth-2);color:var(--sand);border:1px solid var(--faint);border-radius:10px;padding:11px 34px 11px 13px;font-family:inherit;font-size:13px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--clay) 50%),linear-gradient(135deg,var(--clay) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
  optgroup{background:var(--earth-2);color:var(--clay)}option{background:var(--earth-2);color:var(--sand)}
  input[type=range]{flex:1;accent-color:var(--sage);height:22px}input[type=range]:focus-visible{outline:2px solid var(--sage);outline-offset:4px}
  .toggle{background:none;border:1px solid var(--faint);color:var(--clay);font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer}
  .toggle[aria-pressed="true"]{border-color:var(--sage);color:var(--sage)}.toggle:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
  .count{font-size:12px;color:var(--clay);opacity:.6;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .note{font-size:12px;line-height:1.5;color:var(--dim);text-align:center;max-width:310px}
  .install-hint{position:fixed;bottom:0;left:0;right:0;background:var(--earth-2);border-top:1px solid var(--faint);padding:14px 20px calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:13px;line-height:1.5;color:var(--sand);display:none;z-index:10}
  .install-hint .si{display:inline-block;width:16px;height:16px;vertical-align:text-bottom;margin:0 2px}
  .install-hint button{background:none;border:none;color:var(--clay);font-family:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin:6px auto 0;display:block;padding:6px}
  @media(display-mode:standalone){.install-hint{display:none!important}}
</style>

<body>
<p class="title">Yasis Breath Timer</p>
<p class="eyebrow">Four in &nbsp;·&nbsp; eight out</p>
<div class="stage">
  <svg viewBox="0 0 600 190" aria-hidden="true">
    <defs><linearGradient id="breathGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8FA77E"/><stop offset="33%" stop-color="#B0A07A"/><stop offset="100%" stop-color="#C4785A"/></linearGradient></defs>
    <path id="track" class="track"/>
    <line x1="200" y1="24" x2="200" y2="176" stroke="#3D3529" stroke-width="1" stroke-dasharray="3 5" opacity=".55"/>
    <path id="trace" class="trace"/><circle id="dot" r="7" fill="#8FA77E" cx="20" cy="176"/>
  </svg>
</div>
<div class="readout">
  <div id="phrase" class="phrase"></div>
  <div id="phase" class="phase">ready</div>
</div>
<div class="controls">
  <button id="play" class="play">Start</button>
  <div class="row"><label for="preset">Words</label>
    <select id="preset">
      <optgroup label="English">
        <option value="closer-en" selected>Each wave — closer to my baby</option>
        <option value="soft-en">Softening — jaw, shoulders, belly</option>
        <option value="breathesoft-en">Breathe soft — meet resistance with surrender</option>
        <option value="wave-en">The wave — rising and rolling away</option>
        <option value="path-en">Pathway — the breath carries me through</option>
        <option value="thread-en">Golden thread — spinning out</option>
        <option value="open-en">Opening — like a flower</option>
        <option value="drop-en">Surrender — go limp, let go</option>
        <option value="safe-en">Safe — I am safe, my baby is safe</option>
        <option value="calm-en">Calm in — tension out</option>
        <option value="with-en">Partner — I am here with you</option>
        <option value="one-en">One at a time — just this one</option>
        <option value="work-en">Working — my body knows this</option>
        <option value="count-en">Counting — 1 2 3 4 / 8 7 6 5…</option>
      </optgroup>
      <optgroup label="Nederlands">
        <option value="closer-nl">Elke golf — dichter bij mijn kindje</option>
        <option value="soft-nl">Zacht worden — kaak, schouders, buik</option>
        <option value="breathesoft-nl">Adem zacht — niet vechten, meegeven</option>
        <option value="wave-nl">De golf — hij rolt en glijdt weg</option>
        <option value="path-nl">De weg — de adem draagt me erdoor</option>
        <option value="thread-nl">Gouden draad — spinnend weg</option>
        <option value="open-nl">Openen — als een bloem</option>
        <option value="drop-nl">Overgave — loslaten, zakken</option>
        <option value="safe-nl">Veilig — ik ben veilig, mijn kindje ook</option>
        <option value="calm-nl">Rust in — spanning uit</option>
        <option value="with-nl">Partner — ik ben hier bij jou</option>
        <option value="one-nl">Eén tegelijk — alleen deze</option>
        <option value="work-nl">Aan het werk — mijn lichaam weet dit</option>
        <option value="count-nl">Aftellen — 1 2 3 4 / 8 7 6 5…</option>
      </optgroup>
    </select>
  </div>
  <div class="row"><label for="sound">Sound</label>
    <select id="sound">
      <optgroup label="Tones">
        <option value="soft" selected>Soft glide</option>
        <option value="deep">Deep wave</option>
        <option value="bright">Bright wave</option>
        <option value="flute">Flute tone</option>
      </optgroup>
      <optgroup label="Songs · breathe with the melody">
        <option value="song-canon">Canon in D</option>
        <option value="song-ode">Ode to Joy</option>
        <option value="song-nocturne">Nocturne No. 2</option>
        <option value="song-air">Air on the G String</option>
        <option value="song-avemaria">Ave Maria</option>
        <option value="song-swan">The Swan</option>
      </optgroup>
    </select>
  </div>
  <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="55"></div>
  <button id="buzz" class="toggle" aria-pressed="false">Vibrate on turn</button>
  <p id="count" class="count">0 breaths</p>
  <p class="note">Slow, not big. Keep the breath easy — forcing it deep causes tingling and light-headedness.</p>
  <p id="iosNote" class="note" style="display:none">On iPhone, if you hear no sound, check the mute switch on the side of the phone — it silences web-app audio too.</p>
  <p id="audioStatus" class="note" style="display:none"></p>
  <p id="ver" class="count" style="opacity:.3">v6</p>
</div>
<div class="install-hint" id="installHint">
  Tap <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> then <strong>Add to Home Screen</strong>
  <button id="dismissInstall">Got it</button>
</div>
<script>
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('service-worker.js');}catch(err){}}
</script>
<script>
(function(){
var isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
var isSA=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
if(isIos&&!isSA&&!sessionStorage.getItem('ih'))document.getElementById('installHint').style.display='block';
document.getElementById('dismissInstall').addEventListener('click',function(){document.getElementById('installHint').style.display='none';sessionStorage.setItem('ih','1');});

var IN=4,OUT=8,CYCLE=IN+OUT;
var isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIos)document.getElementById('iosNote').style.display='block';

var P={
  // ── MIDWIFE'S PHRASE: each wave brings me closer ──
  'closer-en':{in:"each wave is bringing me closer",
               out:"closer to my baby, closer to holding you safe in my arms"},

  // ── BODY SCAN: practical tension release ──
  'soft-en':{in:"I'm filling up, easy and slow",
             out:"jaw soft, shoulders melting down, belly warm, letting everything go"},

  // ── BREATHE THE BODY SOFT: used through two births by one mother ──
  'breathesoft-en':{in:"I breathe the body soft",
                    out:"meeting all resistance with surrender, sinking down, letting go"},

  // ── WAVE IMAGERY: matches the contraction shape ──
  'wave-en':{in:"here comes the wave, let it rise",
             out:"and it moves through me and it softens and it slowly rolls away"},

  // ── PATHWAY: a midwife's mantra, repeated hundreds of times ──
  'path-en':{in:"the breath is the pathway through",
             out:"I ride the wave, I breathe it through, and on the other side is rest"},

  // ── GOLDEN THREAD: classic hypnobirthing ──
  'thread-en':{in:"breathing in, gentle and slow",
               out:"a golden thread spinning out from my lips, further and further away"},

  // ── FLOWER OPENING: cervix visualisation ──
  'open-en':{in:"with every breath I am opening",
             out:"like a flower in the morning sun, softly, gently, one petal at a time"},

  // ── SURRENDER: don't fight, go limp, drop ──
  'drop-en':{in:"I don't fight it, I drop into it",
             out:"my whole body goes limp and heavy, and I let the bed hold me"},

  // ── SAFE TOGETHER: grounding when fear rises ──
  'safe-en':{in:"I am safe, my baby is safe",
             out:"we are working together, and everything is going as it should"},

  // ── BREATHE IN CALM: classic in/out pairing ──
  'calm-en':{in:"breathing in calm, breathing in peace",
             out:"and breathing out all the tension, all the holding, letting it all go"},

  // ── PARTNER VOICE: for you to say aloud to her ──
  'with-en':{in:"I am here, I am with you",
             out:"you are safe, you are strong, and our baby is on the way home"},

  // ── ONE AT A TIME: reframes each contraction ──
  'one-en':{in:"just this one, only this one",
            out:"it will peak and it will pass, and then there is rest, and we are closer"},

  // ── SELF-EFFICACY: descriptive not boastful ──
  'work-en':{in:"this is my body working",
             out:"strong and steady, doing exactly what it knows how to do"},

  // ── COUNTING: learning fallback ──
  'count-en':{in:"one … two … three … four",
              out:"eight … seven … six … five … four … three … two … one"},

  // ── DUTCH ──
  'closer-nl':{in:"elke golf brengt mij weer dichter",
               out:"dichter bij mijn kindje, dichter bij jou veilig in mijn armen"},

  'soft-nl':{in:"ik vul me langzaam, rustig en traag",
             out:"kaak los, schouders zakken, buik warm en zacht, ik laat alles gaan"},

  'breathesoft-nl':{in:"ik adem het lichaam zacht",
                    out:"niet vechten maar meegeven, zakken, loslaten, het dragen laten"},

  'wave-nl':{in:"daar komt de golf, laat hem maar komen",
             out:"hij stroomt door mij heen, wordt zachter, en glijdt langzaam weer weg"},

  'path-nl':{in:"de adem is de weg erdoor",
             out:"ik rijd de golf, ik adem erdoor, en aan de andere kant is rust"},

  'thread-nl':{in:"ik adem in, zachtjes en rustig",
               out:"een gouden draad die van mijn lippen spint, verder en verder weg"},

  'open-nl':{in:"met elke adem gaat het open",
             out:"als een bloem in de ochtendzon, zachtjes, rustig, blaadje na blaadje"},

  'drop-nl':{in:"ik vecht niet, ik zak erin",
             out:"mijn hele lichaam wordt zwaar en slap, en ik laat me dragen"},

  'safe-nl':{in:"ik ben veilig, mijn kindje is veilig",
             out:"we werken samen, en alles gaat precies zoals het hoort"},

  'calm-nl':{in:"ik adem rust in, ik adem stilte in",
             out:"en ik adem alle spanning uit, alle vasthouden, ik laat het gaan"},

  'with-nl':{in:"ik ben hier, ik ben bij jou",
             out:"je bent veilig, je bent sterk, en ons kindje komt naar huis toe"},

  'one-nl':{in:"alleen deze, alleen nu",
            out:"hij komt op en hij gaat voorbij, en dan is er rust, en we zijn dichter"},

  'work-nl':{in:"dit is mijn lichaam aan het werk",
             out:"sterk en rustig, het doet precies wat het vanzelf al weet"},

  'count-nl':{in:"één … twee … drie … vier",
              out:"acht … zeven … zes … vijf … vier … drie … twee … één"}
};
var words=P['closer-en'];

// ── CURVE ──
var X0=20,X1=580,BASE=176,PEAK=26,N=300,pts=[];
var ease=function(u){return .5*(1-Math.cos(Math.PI*u));};
for(var i=0;i<=N;i++){var p=i/N;var h=p<=IN/CYCLE?ease(p*CYCLE/IN):1-ease((p-IN/CYCLE)*CYCLE/OUT);pts.push({x:X0+p*(X1-X0),y:BASE-h*(BASE-PEAK)});}
var toPath=function(a){return a.map(function(q,i){return(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1);}).join(' ');};
document.getElementById('track').setAttribute('d',toPath(pts));

var trace=document.getElementById('trace'),dot=document.getElementById('dot');
var phraseEl=document.getElementById('phrase'),phaseEl=document.getElementById('phase');
var countEl=document.getElementById('count'),playBtn=document.getElementById('play');
var volEl=document.getElementById('vol'),buzzBtn=document.getElementById('buzz');
var presetEl=document.getElementById('preset'),soundEl=document.getElementById('sound');

var ctx=null,master=null,songBus=null,running=false,nextCycle=0,schedTimer=null,raf=null,startToken=0;
var T0=0,mode='none',modeTimer=null,fallbackEl=null;
var breaths=0,lastPhase=null,buzz=false,sound='soft';
var currentText='',wordSpans=[];

function renderWords(text){
  if(text===currentText)return;currentText=text;
  var parts=text.split(/\s+/);phraseEl.innerHTML='';wordSpans=[];
  parts.forEach(function(w,i){
    if(i>0)phraseEl.appendChild(document.createTextNode(' '));
    var s=document.createElement('span');s.className='w';s.textContent=w;
    phraseEl.appendChild(s);wordSpans.push(s);
  });
}
function lightWords(prog,cls){
  var n=wordSpans.length;var lit=prog*n;
  wordSpans.forEach(function(s,i){s.className=i<lit?'w '+cls:'w';});
}
renderWords("press start, and breathe with the line");

// ── AUDIO ──
// iOS Safari is strict about Web Audio. Gotchas handled here:
//  1) The AudioContext must be created AND resumed inside a user gesture, so we
//     unlock it on the first touch anywhere on the page, not just on Start.
//  2) On some iOS versions ctx.resume() returns a promise that never settles.
//     We NEVER wait on that promise — we poll ctx.state and keep re-resuming
//     until it is running (or give up with a visible message).
//  3) Playing an actual (near-silent) sound inside the gesture is what really
//     opens the iOS audio session, so we blip an oscillator and play a silent
//     <audio> element during unlock.
//  4) iOS's suspend()/resume() is unreliable (after suspend, resume() can stay
//     silent), so Pause never suspends the context — it stops live nodes and
//     mutes the master gain instead. The context stays running.
var unlocked=false,liveNodes=[];
function track(n){liveNodes.push(n);n.onended=function(){var i=liveNodes.indexOf(n);if(i>-1)liveNodes.splice(i,1);};}
function killAll(){liveNodes.slice().forEach(function(n){try{n.stop();}catch(e){}});liveNodes=[];}
function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=volEl.value/100*.6;master.connect(ctx.destination);}
function pump(){if(!ctx||ctx.state!=='suspended')return;try{var p=ctx.resume();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function setAudioStatus(txt){var el=document.getElementById('audioStatus');if(!el)return;el.textContent=txt;el.style.display=txt?'block':'none';}
function unlockAudio(){
  if(unlocked)return;unlocked=true;
  initAudio();pump();warmMedia();
  // iOS can drop the first resume — keep nudging until it is running
  var n=0,iv=setInterval(function(){
    if(!ctx||ctx.state==='running'){clearInterval(iv);return;}
    if(++n>8){clearInterval(iv);return;}
    pump();
  },150);
}
['pointerdown','touchstart'].forEach(function(evt){document.addEventListener(evt,unlockAudio,{once:true,passive:true});});
function ping(){
  if(!ctx||ctx.state!=='running')return;
  try{
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=440;g.gain.value=.0001;
    o.connect(g);g.connect(master);
    o.start();o.stop(ctx.currentTime+.04);
  }catch(e){}
}
// Extra unlock insurance: a silent <audio> element played in the same gesture.
var warmEl=null;
function warmMedia(){
  if(warmEl)return;
  try{
    var sr=44100,n=1024,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    var s=function(o,str){for(var i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);
    v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
    s(36,'data');v.setUint32(40,n*2,true);
    var bytes=new Uint8Array(buf),bin='';
    for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
    warmEl=new Audio('data:audio/wav;base64,'+btoa(bin));
    warmEl.volume=0;warmEl.play().catch(function(){});
  }catch(e){}
}
// ── FALLBACK AUDIO ──
// If iOS refuses to run the Web Audio context, fall back to a looped <audio>
// element playing a pre-rendered glide tone (generated here, no extra files).
// Matches the selected wave sound (pitch + harmonics).
function glideWaveParams(){
  if(sound==='deep')return {scale:.72,harm:0};
  if(sound==='bright')return {scale:1.18,harm:.22};
  if(sound==='flute')return {scale:1,harm:.35};
  return {scale:1,harm:0};
}
function glideWavUrl(){
  var w=glideWaveParams();
  var sr=22050,dur=CYCLE,n=Math.floor(sr*dur),data=new Float32Array(n),ph=0,fade=Math.floor(sr*.02);
  for(var i=0;i<n;i++){
    var sec=i/sr,u=sec<IN?sec/IN:(sec-IN)/OUT;
    var e=.5*(1-Math.cos(Math.PI*u));
    var f=(sec<IN?(190+(300-190)*e):(300-(300-135)*e))*w.scale;
    ph+=2*Math.PI*f/sr;
    var snd=Math.sin(ph);
    if(w.harm>0)snd+=Math.sin(ph*2)*w.harm;
    var a=1;if(i<fade)a=i/fade;else if(i>n-fade)a=(n-i)/fade;
    data[i]=snd*.5*a;
  }
  return wavFromData(data,sr);
}
// Shared WAV encoder (16-bit mono PCM) -> base64 data URI.
// Chunked so no chunk except the last has btoa padding (padding mid-string
// makes browsers' forgiving-base64 stop early — truncated audio).
function wavFromData(data,sr){
  var n=data.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  var s=function(o,str){for(var j=0;j<str.length;j++)v.setUint8(o+j,str.charCodeAt(j));};
  s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  s(36,'data');v.setUint32(40,n*2,true);
  var bytes=new Uint8Array(buf);
  for(var i=0;i<n;i++){var val=Math.floor(Math.max(-1,Math.min(1,data[i]))*32767);bytes[44+i*2]=val&255;bytes[45+i*2]=(val>>8)&255;}
  var bin='',chunk=0xC000; // 49152, divisible by 3 -> no per-chunk btoa padding
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  var b64='';
  for(var i=0;i<bin.length;i+=chunk)b64+=btoa(bin.substr(i,chunk));
  return 'data:audio/wav;base64,'+b64;
}
// ── SONG LOOPS ──
// Gentle synthesized arrangements of public-domain classics, written as one
// 12-beat phrase at 60 BPM (4 beats in, 8 beats out). Each follows the same
// breath-mirroring template so the two halves are unmistakable:
//   · INHALE (beats 0–4)  — a short rising motif, one note per second
//   · EXHALE (beats 4–12) — the resolution: long held notes and a falling line
// Notes are [midi, startBeat, durBeats, vel]; converted to cycle fractions so
// they always span exactly one cycle. Sparse by design.
function midiHz(m){return 440*Math.pow(2,(m-69)/12);}
function songFrac(s){s.tracks.forEach(function(tr){tr.notes.forEach(function(n){n[1]/=12;n[2]/=12;});});return s;}
var SONGS={
  // Iconic cello/bass line, 8 notes: rising D-A-B-F# (in), resolving G-D-G-A (out)
  'song-canon':songFrac({name:'Canon in D',tracks:[
    {type:'bass',vol:.13,notes:[[38,0,.9,1],[45,1,.9,1],[47,2,.9,1],[42,3,.9,1],[43,4,1.8,1],[38,6,1.8,1],[43,8,1.8,1],[38,10,1.8,1]]},
    {type:'pad',vol:.04,pad:true,notes:[[50,0,4,1],[54,0,4,1],[57,0,4,1],[55,4,8,1],[59,4,8,1],[62,4,8,1]]}
  ]}),
  // The most famous melody in the world: rising E-E-F-G (in), arching G-F-E-D C-C-D-E (out)
  'song-ode':songFrac({name:'Ode to Joy',tracks:[
    {type:'lead',vol:.13,notes:[[64,0,1,1],[64,1,1,1],[65,2,1,1],[67,3,1,1],[67,4,1,1],[65,5,1,1],[64,6,1,1],[62,7,1,1],[60,8,1,1],[60,9,1,1],[62,10,1,1],[64,11,1,1]]},
    {type:'pad',vol:.04,pad:true,notes:[[48,0,4,1],[52,0,4,1],[55,0,4,1],[48,4,4,1],[52,4,4,1],[55,4,4,1],[43,8,4,1],[47,8,4,1],[50,8,4,1]]}
  ]}),
  // Romantic piano: rising Bb-C-D-Eb (in), the long Eb then falling D-C-Bb (out)
  'song-nocturne':songFrac({name:'Nocturne No. 2',tracks:[
    {type:'lead',vol:.13,notes:[[70,0,1,1],[72,1,1,1],[74,2,1,1],[75,3,1,1],[75,4,2,1],[74,6,1,1],[72,7,1,1],[70,8,4,1]]},
    {type:'pad',vol:.04,pad:true,notes:[[51,0,4,1],[55,0,4,1],[58,0,4,1],[51,4,4,1],[55,4,4,1],[58,4,4,1],[46,8,4,1],[53,8,4,1],[58,8,4,1]]}
  ]}),
  // Baroque strings: rising D-F#-A-B (in), the arch C#-D held, then falling back (out)
  'song-air':songFrac({name:'Air on the G String',tracks:[
    {type:'lead',vol:.13,notes:[[62,0,1,1],[66,1,1,1],[69,2,1,1],[71,3,1,1],[73,4,1,1],[74,5,2,1],[78,7,.5,1],[76,7.5,.5,1],[74,8,.5,1],[73,8.5,.5,1],[71,9,1,1],[69,10,1,1],[62,11,1,1]]},
    {type:'pad',vol:.045,pad:true,notes:[[50,0,12,1],[54,0,12,1],[57,0,12,1]]}
  ]}),
  // Schubert: rising A-Bb-C-D (in), the iconic falling 'A-ve Ma-ri-a' (out)
  'song-avemaria':songFrac({name:'Ave Maria',tracks:[
    {type:'lead',vol:.13,notes:[[69,0,1,1],[70,1,1,1],[72,2,1,1],[74,3,1,1],[74,4,2,1],[72,6,1,1],[70,7,2,1],[69,9,3,1]]},
    {type:'pad',vol:.04,pad:true,notes:[[46,0,4,1],[53,0,4,1],[58,0,4,1],[51,4,4,1],[55,4,4,1],[58,4,4,1],[41,8,4,1],[48,8,4,1],[53,8,4,1]]}
  ]}),
  // Cello arpeggio: rising G-B-D (in), the swan's gentle falling waves (out)
  'song-swan':songFrac({name:'The Swan',tracks:[
    {type:'lead',vol:.13,notes:[[67,0,2,1],[71,2,1,1],[74,3,1,1],[71,4,1,1],[67,5,1,1],[69,6,1,1],[72,7,1,1],[69,8,1,1],[66,9,1,1],[67,10,2,1]]},
    {type:'pad',vol:.04,pad:true,notes:[[43,0,4,1],[47,0,4,1],[50,0,4,1],[48,4,4,1],[52,4,4,1],[55,4,4,1],[50,8,4,1],[54,8,4,1],[57,8,4,1]]}
  ]})
};
function songDef(){return sound.indexOf('song-')===0?SONGS[sound]:null;}
function ensureSongBus(){
  if(songBus||!ctx)return;
  songBus=ctx.createGain();songBus.gain.value=1;
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.Q.value=.3;
  songBus.connect(lp);lp.connect(master);
  var dl=ctx.createDelay();dl.delayTime.value=.42;
  var fb=ctx.createGain();fb.gain.value=.35;
  var wet=ctx.createGain();wet.gain.value=.2;
  songBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
}
function scheduleSong(t0){
  var sd=songDef();if(!sd)return;
  ensureSongBus();
  var beat=CYCLE/12; // 1 beat = 1s at 60 BPM; scale with cycle
  sd.tracks.forEach(function(tr){
    tr.notes.forEach(function(n){
      var st=t0+n[1]*CYCLE,dur=n[2]*CYCLE,v=tr.vol*(n[3]||1);
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type=tr.type==='bass'?'sine':'sine';
      o.frequency.value=midiHz(n[0]);
      var att=(tr.type==='pad'?.4:.05)*beat,rel=(tr.type==='pad'?.6:.18)*beat;
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),st+att);
      g.gain.setValueAtTime(Math.max(.0002,v),st+Math.max(att,dur-rel));
      g.gain.exponentialRampToValueAtTime(.0001,st+dur);
      o.connect(g);
      if(tr.pad){var o2=ctx.createOscillator(),g2=ctx.createGain();o2.type='sine';o2.frequency.value=midiHz(n[0])*1.004;g2.gain.value=.8;o2.connect(g2);g2.connect(g);o2.start(st);o2.stop(st+dur+.1);track(o2);}
      g.connect(songBus);
      track(o);
      o.start(st);o.stop(st+dur+.1);
    });
  });
}
// Render a song to PCM for the HTML5 fallback path.
function renderSongWav(){
  var sd=songDef();if(!sd)return null;
  var sr=22050,n=Math.floor(sr*CYCLE),data=new Float32Array(n);
  var beat=CYCLE/12;
  sd.tracks.forEach(function(tr){
    tr.notes.forEach(function(note){
      var f=midiHz(note[0]),v=tr.vol*(note[3]||1);
      var att=(tr.type==='pad'?.4:.05)*beat,rel=(tr.type==='pad'?.6:.18)*beat;
      var st=Math.floor(note[1]*CYCLE*sr),nd=Math.floor((note[1]+note[2])*CYCLE*sr);
      var aI=Math.max(1,Math.floor(att*sr)),rI=Math.max(1,Math.floor(rel*sr));
      for(var i=st;i<nd&&i<n;i++){
        var t=(i-st)/sr,env=1;
        if(i-st<aI)env=(i-st)/aI;
        var rp=nd-i;if(rp<rI)env=Math.min(env,rp/rI);
        data[i]+=Math.sin(2*Math.PI*f*t)*v*env;
        if(tr.pad)data[i]+=Math.sin(2*Math.PI*f*1.004*t)*v*env*.8;
      }
    });
  });
  var peak=0;for(var i=0;i<n;i++){var a=Math.abs(data[i]);if(a>peak)peak=a;}
  if(peak>.5){var s=.5/peak;for(var i=0;i<n;i++)data[i]*=s;}
  return wavFromData(data,sr);
}
function fallbackSrc(){return songDef()?renderSongWav():glideWavUrl();}
function audioLabel(){var sd=songDef();return sd?sd.name:null;}
function primeFallback(){
  if(fallbackEl&&fallbackEl._wave!==sound){try{fallbackEl.pause();}catch(e){}fallbackEl=null;}
  if(!fallbackEl){
    try{fallbackEl=new Audio(fallbackSrc());fallbackEl._wave=sound;}catch(e){return;}
    fallbackEl.loop=true;
  }
  try{
    fallbackEl.volume=0;
    fallbackEl.currentTime=0;
    var p=fallbackEl.play();if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function unmuteFallback(){
  if(!fallbackEl)return;
  fallbackEl.volume=Math.max(.05,volEl.value/100*.8);
}
function pad(t0,dur,f0,f1,peak){
  var o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter();
  var f0a=f0,f1a=f1,ot='sine',ot2='triangle',g2v=.18,lpf=1200;
  if(sound==='deep'){f0a=f0*.72;f1a=f1*.72;ot='sine';ot2='sine';g2v=.28;lpf=850;}
  else if(sound==='bright'){f0a=f0*1.18;f1a=f1*1.18;ot='triangle';ot2='sine';g2v=.10;lpf=2400;}
  else if(sound==='flute'){ot='sine';ot2='sine';g2v=.14;lpf=1500;}
  lp.type='lowpass';lp.frequency.value=lpf;lp.Q.value=.5;
  o.type=ot;o2.type=ot2;g2.gain.value=g2v;
  [o,o2].forEach(function(x){x.frequency.setValueAtTime(f0a,t0);x.frequency.linearRampToValueAtTime(f1a,t0+dur);});
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+Math.min(.6,dur*.15));
  g.gain.setValueAtTime(peak,t0+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(master);
  track(o);track(o2);
  o.start(t0);o2.start(t0);o.stop(t0+dur+.05);o2.stop(t0+dur+.05);
}
function scheduleCycle(t0){
  if(songDef()){scheduleSong(t0);return;}
  pad(t0,IN,190,300,.14);pad(t0+IN,OUT,300,135,.12);
}
function scheduler(){
  if(!running)return;
  if(mode==='web'){audioGo();}
  else if(mode==='none'){
    if(ctx&&ctx.state==='running'){mode='web';nextCycle=performance.now()+300;audioGo();}
    else if(ctx&&ctx.state==='suspended'){pump();}
  }
  updateStatus();
}

function draw(){
  var sec;
  if(mode==='fallback'&&fallbackEl&&fallbackEl.currentTime>0){
    sec=fallbackEl.currentTime%CYCLE; // follow the fallback loop
  }else{
    sec=((performance.now()-T0)/1000)%CYCLE;
    if(sec<0)sec+=CYCLE;
  }
  var idx=Math.min(N,Math.floor(sec/CYCLE*N));
  trace.setAttribute('d',toPath(pts.slice(0,idx+1)));
  dot.setAttribute('cx',pts[idx].x);dot.setAttribute('cy',pts[idx].y);
  var inhaling=sec<IN,prog=inhaling?sec/IN:(sec-IN)/OUT;
  renderWords(inhaling?words.in:words.out);
  lightWords(prog,inhaling?'li':'lo');
  dot.setAttribute('fill',inhaling?'#8FA77E':'#C4785A');
  phaseEl.textContent=(inhaling?'breathe in · ':'breathe out · ')+(inhaling?IN-Math.floor(sec):OUT-Math.floor(sec-IN));
  var phase=inhaling?'in':'out';
  if(phase!==lastPhase){
    if(lastPhase==='out'){breaths++;countEl.textContent=breaths+(breaths===1?' breath':' breaths');}
    if(buzz&&navigator.vibrate)navigator.vibrate(inhaling?45:[30,60,30]);
    lastPhase=phase;
  }
  raf=requestAnimationFrame(draw);
}

// ── WEB AUDIO PATH ──
function audioGo(){
  if(!running||!ctx||ctx.state!=='running')return;
  var now=performance.now();
  while(nextCycle<now+1500){
    scheduleCycle(ctx.currentTime+(nextCycle-now)/1000);
    nextCycle+=CYCLE*1000;
  }
}
function updateStatus(){
  if(!running)return;
  var lbl=audioLabel();
  if(mode==='web'){setAudioStatus(lbl?('audio: '+lbl):'audio: running');}
  else if(mode==='fallback'){
    setAudioStatus(fallbackEl&&fallbackEl.volume>0?(lbl?('audio: '+lbl):'audio: fallback tone'):'audio blocked — check the mute switch, then tap Start again');
  }
  else if(ctx&&ctx.state==='suspended'){setAudioStatus('audio blocked — check the mute switch, then tap Start again');}
}
function start(){
  initAudio();
  var my=++startToken;
  running=true;playBtn.textContent='Pause';
  if(master)master.gain.value=volEl.value/100*.6;
  T0=performance.now()+200;nextCycle=T0;lastPhase=null;mode='none';
  ping();pump();primeFallback(); // all inside the tap gesture
  clearTimeout(modeTimer);
  modeTimer=setTimeout(function(){
    if(my!==startToken||!running)return;
    if(ctx&&ctx.state==='running'){mode='web';if(fallbackEl){try{fallbackEl.pause();}catch(e){}}audioGo();}
    else{mode='fallback';unmuteFallback();}
    updateStatus();
  },900);
  schedTimer=setInterval(scheduler,250);
  raf=requestAnimationFrame(draw);
  updateStatus();
}
function stop(){
  running=false;startToken++;
  clearTimeout(modeTimer);
  clearInterval(schedTimer);schedTimer=null;
  cancelAnimationFrame(raf);
  killAll();
  if(master)master.gain.value=0;
  if(fallbackEl){try{fallbackEl.pause();fallbackEl.currentTime=0;}catch(e){}}
  playBtn.textContent='Start';
  renderWords(words.in);wordSpans.forEach(function(s){s.className='w';});
  phaseEl.textContent='paused';
  setAudioStatus('');
}

playBtn.addEventListener('click',function(){running?stop():start();});
soundEl.addEventListener('change',function(){sound=soundEl.value;});
presetEl.addEventListener('change',function(){words=P[presetEl.value];if(!running){renderWords(words.in);wordSpans.forEach(function(s){s.className='w';});}});
volEl.addEventListener('input',function(){if(master)master.gain.value=volEl.value/100*.6;});
buzzBtn.addEventListener('click',function(){buzz=!buzz;buzzBtn.setAttribute('aria-pressed',String(buzz));if(buzz&&navigator.vibrate)navigator.vibrate(30);});
})();
</script>
